[package]
name = "freebank"
version = "0.1.1"
description = "FreeBank: set up, run and use a FreeBank node (BIP 300/301 drivechain, slot 130)"
authors = ["The FreeBank developers"]
license = "MIT"
repository = "https://github.com/mbdrivechains/freebank-app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
thiserror = "1"

# First-run install: verify and unpack the freebankd release, pick a block name
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
tar = "0.4"
rand = "0.8"
# The release signature: SHA256SUMS.sig (OpenSSH, ed25519) against the pinned release key
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519"] }


[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[package]
name = "freebank"
version = "0.4.1"
description = "FreeBank: set up, run and use a FreeBank node (BIP 300/301 drivechain, slot 130)"
authors = ["The FreeBank developers"]
license = "MIT"
repository = "https://github.com/mbdrivechains/freebank-app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
thiserror = "1"

# First-run install: verify and unpack the freebankd release, pick a block name
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
tar = "0.4"
rand = "0.8"
# The release signature: SHA256SUMS.sig (OpenSSH, ed25519) against the pinned release key
ssh-key = { version = "0.6.7", default-features = false, features = ["std", "ed25519"] }
# v0.2.0 wallet: the app seed (24 BIP39 words; the FreeBank HD seed from them by BIP85), kept encrypted
# with the wallet passphrase (Argon2id, then XChaCha20-Poly1305) in <app data>/wallet/seed.enc
bip39 = { version = "2.2", features = ["zeroize"] }
bitcoin = { version = "0.32", default-features = false, features = ["std"] }
argon2 = { version = "0.5", features = ["zeroize"] }
chacha20poly1305 = "0.10"
# (zeroize, which the wallet code also uses, is listed with the phone relay's crates below)
# The phone relay (relay/PROTOCOL.md in freebank-distribution): P-256 ECDH + ECDSA, HKDF, AES-GCM,
# and the outbound WebSocket to the relay
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "pkcs8"] }
hkdf = "0.12"
aes-gcm = "0.10"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
url = "2"
# The wallet passphrase for phone sends lives only in memory and is wiped when it is let go
zeroize = "1"
# "Copy words": HTML and plain text at once, kept out of clipboard managers' history
arboard = { version = "3.6", default-features = false }


[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# The app updater reads FREEBANK_UPDATE_URL and FREEBANK_UPDATE_KEY instead of GitHub and the release key, for the
# end-to-end test of an update (app_update.rs). Never in a release build.
update-test = []

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

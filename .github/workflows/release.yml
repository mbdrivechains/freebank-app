name: release

# A tag vX.Y.Z builds the app for Linux and macOS and publishes a GitHub Release with the files and their
# checksums. The apt repository follows only once the release key's holder has signed the checksums: apt.yml, which release-app.sh's
# `after` step runs (app v0.2.6; before, apt published at tag time, ahead of the signature).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default. Only the jobs that publish get write access (review of v0.1.1, finding 4).
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: v
        name: Check the tag matches the app version
        run: |
          app=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          crate=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          [ "$app" = "$pkg" ] && [ "$app" = "$crate" ] || { echo "versions differ: tauri $app, npm $pkg, cargo $crate"; exit 1; }
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            [ "${GITHUB_REF_NAME}" = "v$app" ] || { echo "tag ${GITHUB_REF_NAME} does not match app version $app"; exit 1; }
          fi
          echo "version=$app" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    # Built in the pinned image (build/linux/Dockerfile: Ubuntu 22.04, so the package installs on 22.04 and newer), so
    # anyone can rebuild the program and the .deb from the tag and get the same bytes (build/linux/rebuild.sh,
    # VERIFY.md). The AppImage is packed in the same image, but not reproducibly yet (VERIFY.md says why).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Build in the pinned image
        run: OUT="$PWD/out" BUNDLES=deb,appimage JOBS=4 build/linux/rebuild.sh HEAD
      - name: Collect
        run: |
          rm out/freebank
          test -f "out/freebank_${{ needs.version.outputs.version }}_amd64.deb"
          test -f "out/FreeBank_${{ needs.version.outputs.version }}_amd64.AppImage"
          ls -l out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: out/*
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.20.2
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 2026-09-29
        with:
          toolchain: 1.98.1
          # One universal app for Apple Silicon and Intel Macs.
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      # No install scripts: only esbuild (it finds its binary without) and fsevents (a file watcher, not needed for a
      # build) have one, and none runs with the build's rights (v0.2.5).
      - run: npm ci --ignore-scripts
      # Ad-hoc signed only (bundle.macOS.signingIdentity "-"), not notarised: the first launch needs
      # System Settings > Privacy & Security > Open Anyway.
      - run: npx tauri build --target universal-apple-darwin --bundles app,dmg
      - name: Collect
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg "out/FreeBank_${V}_universal.dmg"
          # What the app updates itself from (src-tauri/src/app_update.rs): FreeBank.app alone, without macOS's
          # extended attributes (no ._ files), the same bundle the disk image holds.
          app="out/FreeBank_${V}_universal.app.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$app" -C src-tauri/target/universal-apple-darwin/release/bundle/macos FreeBank.app
          tar -tzf "$app" > "$RUNNER_TEMP/app-files.txt"
          if grep -q '\._' "$RUNNER_TEMP/app-files.txt"; then echo "::error::$app holds ._ files"; exit 1; fi
          tar -xzOf "$app" FreeBank.app/Contents/Info.plist | grep -q "<string>${V}</string>"
          ls -l out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: out/*
          if-no-files-found: error

  release:
    needs: [version, linux, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Only the packages, by name: the apt job's Pages artifact (artifact.tar) must never become a release asset
      # (it did in v0.2.0, when that job finished first; removed from the release by hand).
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux
          path: out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos
          path: out
      - name: Record build attestations for the packages
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            out/*.deb
            out/*.AppImage
            out/*.dmg
            out/*.app.tar.gz
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          {
            # This release's own notes (what's new, the security self-audit), when the tag has them.
            if [ -f "release-notes/$TAG.md" ]; then cat "release-notes/$TAG.md"; echo; fi
            cat <<'EOF'
          ## Install

          **Ubuntu 22.04+ / Debian 12+:** download the `.deb` below and double-click it
          (or `sudo apt install ./freebank_*.deb`).

          **Other Linux:** the AppImage below (`chmod +x` it, then run it).

          **macOS (Apple Silicon and Intel):** open the `.dmg` and drag FreeBank to Applications. This build is not
          notarised yet, so the first time macOS will refuse to open it: go to **System Settings → Privacy & Security**
          and choose **Open Anyway**. The FreeBank node needs macOS 14 or later on Apple Silicon, and macOS 15 or later
          on Intel.

          ## Updates

          From v0.2.4 on, FreeBank says when a new version is out. The AppImage and the Mac app update themselves
          (**Update and restart**). The `.deb` updates with Software Updater once FreeBank's apt repository is set up
          (https://apt.ecxfreebank.com), or with the new `.deb`. The AppImage and the Mac app take an update only when
          the release's `SHA256SUMS` carries the release key's signature; apt checks its repository's own key.
          (`FreeBank_*_universal.app.tar.gz` is the Mac app's update.)

          FreeBank runs beside an eCash beta full node and its enforcer. BitWindow in full-node mode is the easiest way
          to have both.

          ## Check your download

          Compare the file with `SHA256SUMS`. When `SHA256SUMS.sig` is listed, it is signed with the FreeBank release
          key; the README's "Verify your download" shows how to check it. GitHub also records a build attestation for
          each package: `gh attestation verify <file> --repo mbdrivechains/freebank-app`.
          EOF
          } > "$notes"
          cd out
          sha256sum * > SHA256SUMS
          files=$(ls)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Never replace a published file (review of v0.1.1, finding 5): upload only the missing ones, and stop
            # if a rebuilt file differs from the published copy, as scripts/build-apt-repo.sh does for the .deb.
            published=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
            mkdir -p "$RUNNER_TEMP/published"
            missing=""
            for f in $files; do
              if printf '%s\n' "$published" | grep -qxF "$f"; then
                gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$f" --dir "$RUNNER_TEMP/published" --clobber
                if ! cmp -s "$f" "$RUNNER_TEMP/published/$f"; then
                  echo "::error::$f differs from the copy already published on $TAG. Not replacing it."
                  exit 1
                fi
              else
                missing="$missing $f"
              fi
            done
            if [ -n "$missing" ]; then gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" $missing; fi
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "FreeBank app $TAG" --notes-file "$notes" $files
          fi
